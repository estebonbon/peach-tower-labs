<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a New Document | Peach Tower Labs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7">
                <section class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h2 mb-2">Create a New Document</h1>
                        <p class="text-secondary mb-4">Enter a title and the document content below.</p>

                        <!-- Required fields use browser validation before JavaScript submits them. -->
                        <form id="create-form">
                            <div class="mb-3">
                                <label for="title" class="form-label">Title</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="title"
                                    name="title"
                                    required
                                    aria-describedby="title-help">
                                <div id="title-help" class="form-text">Enter a short, descriptive title.</div>
                            </div>

                            <div class="mb-4">
                                <label for="content" class="form-label">Content</label>
                                <textarea
                                    class="form-control"
                                    id="content"
                                    name="content"
                                    rows="8"
                                    required></textarea>
                            </div>

                            <p id="form-message" class="mb-3" role="status" aria-live="polite"></p>

                            <div class="d-flex flex-column flex-sm-row gap-2">
                                <button type="submit" class="btn btn-primary">Submit</button>
                                <button type="button" id="cancel-button" class="btn btn-outline-secondary">Cancel</button>
                            </div>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script>
        const form = document.querySelector("#create-form");
        const message = document.querySelector("#form-message");
        const submitButton = form.querySelector('button[type="submit"]');
        const titleField = form.elements.namedItem("title");
        const contentField = form.elements.namedItem("content");

        // Send the form fields as JSON to the Express API.
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            message.textContent = "";

            // Reject blank fields, including values made only of spaces.
            titleField.setCustomValidity(titleField.value.trim() ? "" : "Please enter a title.");
            contentField.setCustomValidity(contentField.value.trim() ? "" : "Please enter document content.");
            if (!form.reportValidity()) {
                return;
            }

            const documentData = {
                title: titleField.value.trim(),
                content: contentField.value.trim()
            };

            submitButton.disabled = true;
            message.textContent = "Submitting...";

            try {
                // Change this URL if the Express API uses a different route.
                const response = await fetch("/api/documents", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(documentData)
                });

                if (!response.ok) {
                    throw new Error(`The server returned ${response.status}.`);
                }

                form.reset();
                message.textContent = "Document created successfully.";
            } catch (error) {
                message.textContent = `Could not submit the document. ${error.message}`;
            } finally {
                submitButton.disabled = false;
            }
        });

        // Cancel returns to the project's home page without submitting the form.
        document.querySelector("#cancel-button").addEventListener("click", () => {
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
