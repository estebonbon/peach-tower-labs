<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CrossFire NCR System</title>
        <meta name="description" content="CrossFire Canada Non-Conformance Report System">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div id="app">
            <!-- App.Vue has a template that contains SideBarNavigation and RouterView 
                 This means that the Sidebar will always be displayed and visible, and
                 That the RouterView will display the appropriate content based on the current route 
                 
                 Basically this is an empty space waiting for vue to fill it with content
                 Vue uses the id="app" to target this div and display the Vue application -->

        </div> 
        <script type="module" src="/src/main.js">

            /* This code tells the browser to load and run main.js,
                When this happens, the main.js file will create a Vue application 
                And mount it to the #app <div> in the index.html file. */
        </script>
    </body>
</html>
