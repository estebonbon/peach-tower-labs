<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCR Log</title>
     <meta name="description" content="Edit an existing Non-Conformance Report">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-container"></div>
    
    <main class="content status-page">
          <div class="row justify-content-center">
            <div class="col-12 "> <!--col-lg-10-->
                <section class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <header class="form-header mb-4">
                            <div class="header-content">
                                <span class="header-extra">QUALITY MANAGEMENT NCR</span>
                                <h1 class="h2 mb-2">NCR Log</h1>
                                <p class="text-secondary mb-0">
                                     View current and completed NCRs, reserve the next
                                    available NCR number, or update an existing report.
                                </p>
                            </div>
                        </header> 
    
            <!-- <div class="alert alert-info" role="status">
                <strong>Next available NCR number:</strong>
                <span id="next-ncr-number">2026-004</span>
            </div>> -->

            <div class="mb-4">
                <label for="ncrSearch" class="form-label">
                    Search by NCR Number
                </label>
            
                <input
                    type="search"
                    id="ncrSearch"
                    class="form-control"
                    placeholder="Search NCR number, e.g. 2026-011"
                >
            </div>

            <div class="d-flex flex-row align-items-center gap-4 mb-3 flex-rap ncr-log-filters">

                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" id="activeOnly">
                    <label class="form-check-label" for="activeOnly">Show Active </label>
                </div>
            
                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" id="closedOnly">
                    <label class="form-check-label" for="closedOnly">Show Closed </label>
                </div>
            
                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" id="engineeringOnly">
                    <label class="form-check-label" for="engineeringOnly">Engineering Required</label>
                </div>

                <div class="stage-filter d-flex align-items-center gap-2">
                    <label for="stageFilter" class="mb-0 fw-semibold">Stage</label>
                        <select id="stageFilter" class="form-select">
                                <option value="">All Stages</option>
                                <option value="Quality Review">Quality Review</option>
                                <option value="Engineering Review">Engineering Review</option>
                                <option value="Completed">Completed</option>
                            </select>
                </div>  
            
            </div>

            <div class="table-responsive">
                <table class="table ncr-log-table align-middle" style="width: 100%;">
                    <thead>
                        <tr>
                            <th scope="col" style="width: 15%;">NCR Number</th>
                            <th scope="col" style="width: 27%;">Supplier</th>
                            <th scope="col" style="width: 17%;">Date Created</th>
                            <th scope="col" style="width: 15%;">Status</th>
                            <th scope="col" style="width: 20%;">Current Stage</th>
                            <th scope="col" style="width: 25%;">Actions</th>
                        </tr>
                    </thead>
                
                    <tbody id="ncr-table-body">
                        <!-- JavaScript will insert NCR records here -->
                    </tbody>
                
                </table>
            </div>

            <p id="log-help" class="text-secondary">
                Select Details to review a report or Edit to update its
                Quality Inspector information.
            </p>

        </section>
            </div>
    </main>
<script type="module" src="/status.js"></script>
<script src="js/navbar.js"></script>
</body>
</html>

<style scoped>
    /* Edit button */
    .ncr-log-table .btn-primary {
        background-color: #193b59;
        border-color: #193b59;
        color: white;
    }

    /* Details button */
    .ncr-log-table .btn-secondary {
        background-color: #6c757d;
        border-color: #6c757d;
        color: white;
    }

    /* NCR Log action buttons */
    .ncr-log-table .btn-primary,
    .ncr-log-table .btn-secondary {
        width: 110px;
        min-width: 110px;
        padding: 10px 12px;
        text-align: center;
        flex: none;
    }
    .ncr-stage {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 6px;
    background-color: #e8eef5;
    color: #173451;
    font-size: 13px;
    font-weight: 600;
}
</style>
